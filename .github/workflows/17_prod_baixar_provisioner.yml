# Coloca o instalador Linux do Corpflix Provisioner (.deb) no relay
# (public/apks/corpflix-provisioner/) sem SSH nem SSM local — mesmo esquema do 16.
# O upload-to-midia.sh do corpflix sobe por SSM, que é negado pras credenciais de dev.
#
#   1. aws s3 cp dist/corpflix_install.deb s3://erp-prod-virginia/paperclip-mediaconvert-out/corpflix-deploy/corpflix_install-AAAAMMDD-HHMMSS-<commit>.deb
#   2. aws s3 presign ... --expires-in 3600
#   3. gh workflow run 17_prod_baixar_provisioner.yml -f url='<presigned>' -f nome=corpflix_install-....deb -f sha256=<sha>
#
# Grava o versionado e copia por cima do "latest" corpflix_install.deb.
name: 17_prod_baixar_provisioner

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL presigned do S3 (prefixo paperclip-mediaconvert-out/corpflix-deploy/)'
        required: true
      nome:
        description: 'ex: corpflix_install-20261105-201013-4ad47b7.deb'
        required: true
      sha256:
        description: 'sha256 esperado'
        required: true

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: valida entradas
        env:
          URL: ${{ inputs.url }}
          NOME: ${{ inputs.nome }}
          SHA: ${{ inputs.sha256 }}
        run: |
          set -eu
          [[ "$URL" =~ ^https://erp-prod-virginia\.s3(\.us-east-1)?\.amazonaws\.com/paperclip-mediaconvert-out/corpflix-deploy/corpflix_install-[0-9]{8}-[0-9]{6}-[0-9a-f]{7,12}\.deb\?[A-Za-z0-9._~%=\&-]+$ ]] || { echo "URL fora do padrão"; exit 1; }
          [[ "$NOME" =~ ^corpflix_install-[0-9]{8}-[0-9]{6}-[0-9a-f]{7,12}\.deb$ ]] || { echo "nome fora do padrão"; exit 1; }
          [[ "$SHA" =~ ^[0-9a-f]{64}$ ]] || { echo "sha256 inválido"; exit 1; }
          echo ok

  baixar:
    needs: validar
    uses: denoww/github_actions/.github/workflows/rodar_comandos_em_todos_ec2_com_tag.yml@2a3a0859a694fbfc33d617f6072f0d1e89180b18
    with:
      aws_region: us-east-1
      ec2_com_tag: midia_indoor_player
      remote_cmd: >-
        set -e ;
        DIR=/var/lib/midia_indoor_player/public/apks/corpflix-provisioner ;
        mkdir -p "$DIR" ;
        DEST="$DIR/${{ inputs.nome }}" ;
        curl -fsSL -o "$DEST.tmp" '${{ inputs.url }}' ;
        echo "${{ inputs.sha256 }}  $DEST.tmp" | sha256sum -c - ;
        mv "$DEST.tmp" "$DEST" ;
        cp -f "$DEST" "$DIR/corpflix_install.deb" ;
        chown ubuntu:ubuntu "$DEST" "$DIR/corpflix_install.deb" ;
        ls -la "$DIR" | tail -5
    secrets: inherit
