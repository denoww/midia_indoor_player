# Diagnóstico SÓ-LEITURA do cloud relay (PM2). Não reinicia nem altera nada.
#
# Existe porque o SSM direto é negado pras credenciais de dev: sem ele, a única
# janela pro log do relay era o 14 (que REINICIA o processo e zera a fila).
# Use quando uma mídia nova demora pra aparecer em
# https://midiaindoor.seucondominio.com.br:4002/<tv>/... — mostra carga da
# máquina, o que a fila de download está fazendo e o que está falhando.
name: 15_prod_diagnostico_relay

on:
  workflow_dispatch: {}

jobs:
  diagnostico:
    uses: denoww/github_actions/.github/workflows/rodar_comandos_em_todos_ec2_com_tag.yml@2a3a0859a694fbfc33d617f6072f0d1e89180b18
    with:
      aws_region: us-east-1
      ec2_com_tag: midia_indoor_player
      # ⚠️ O SSM corta a saída em ~24 mil caracteres: mantenha cada bloco curto
      # (linhas cortadas em 220 colunas) e o que mais importa primeiro.
      remote_cmd: >-
        cd /var/lib/midia_indoor_player ;
        sudo -u ubuntu git log --oneline -1 ;
        uptime ; free -m | head -2 ; df -h /var/lib/midia_indoor_player | tail -1 ;
        echo '--- logs do pm2 ---' ;
        ls -la --time-style=+%F_%T /home/ubuntu/.pm2/logs/ | tail -n 8 ;
        OUT=$(ls -t /home/ubuntu/.pm2/logs/MIDIAINDOOR-out*.log | head -1) ; echo "OUT=$OUT" ;
        echo '--- tv 72 ---' ;
        ls -la --time-style=+%F_%T public/72 public/72/videos 2>&1 | head -20 ;
        echo '--- contagem por tipo (ultimas 20000 linhas) ---' ;
        sudo -u ubuntu tail -n 20000 "$OUT" | grep -oE 'Download (alternativo HTTP [0-9]+|alternativo|Buffer|watchdog)|Download -> [A-Za-z]+|saveLogo Download' | sort | uniq -c | sort -rn | head -20 ;
        echo '--- Download/watchdog/saveLogo (ultimas 40) ---' ;
        sudo -u ubuntu tail -n 20000 "$OUT" | grep -E 'Download|watchdog|saveLogo' | tail -n 40 | cut -c1-220 ;
        echo '--- out log cru (ultimas 15) ---' ;
        sudo -u ubuntu tail -n 15 "$OUT" | cut -c1-220 ;
        echo '--- error log (ultimas 15) ---' ;
        sudo -u ubuntu tail -n 15 /home/ubuntu/.pm2/logs/MIDIAINDOOR-error.log | cut -c1-220
    secrets: inherit
