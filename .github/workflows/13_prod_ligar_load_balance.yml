name: 13_prod_ligar_load_balance

on:
  workflow_dispatch: {}
  workflow_call:

jobs:
  ligar_ec2_nos_loadbalancers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - EC2_COM_TAG_PROJETOS: "midia_indoor_player"
            AWS_REGION: "us-east-1"
            LOADBALANCE_ALB_NAME: "seucondominio-web"
            LOADBALANCE_PORTS: "https:4002:http:4001,http:4001:http:4001"
            LOADBALANCE_CERTIFICADO_HTTPS: "arn:aws:acm:us-east-1:516862767124:certificate/99570c7a-1fb8-4e70-b340-637f7bcaa535"

    # O script deixou de vir de gist publico por `curl | sudo bash`: agora viaja embutido
    # no workflow reusavel (repo privado, revisavel), entregue por SSM. Ver PSC-48.
    # O `@<sha>` e proposital: bump do reusavel exige PR revisavel aqui.
    uses: denoww/github_actions/.github/workflows/ligar_ec2_nos_loadbalancers.yml@56ac8e1c975b4196e8c99e10af0cc143e22ebc8e
    with:
      aws_region:            ${{ matrix.AWS_REGION }}
      ec2_com_tag:           ${{ matrix.EC2_COM_TAG_PROJETOS }}
      alb_name:              ${{ matrix.LOADBALANCE_ALB_NAME }}
      ports:                 ${{ matrix.LOADBALANCE_PORTS }}
      certificado_https_arn: ${{ matrix.LOADBALANCE_CERTIFICADO_HTTPS }}
    secrets: inherit
