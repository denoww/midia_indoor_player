# TEMPORÁRIO — remover após uso (diagnóstico pré-migração request→axios).
name: 15_tmp_diag_node

on:
  workflow_dispatch: {}

jobs:
  diag:
    uses: denoww/github_actions/.github/workflows/rodar_comandos_em_todos_ec2_com_tag.yml@main
    with:
      aws_region: us-east-1
      ec2_com_tag: midia_indoor_player
      remote_cmd: >-
        sudo -u ubuntu bash -lc 'node -v; npm -v; which node' &&
        head -2 /etc/os-release &&
        ldd --version | head -1
    secrets: inherit
